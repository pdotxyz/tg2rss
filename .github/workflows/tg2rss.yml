
name: tg2rss

on:
  schedule:
    - cron: "51 * * * *"
      timezone: "America/Los_Angeles"

  workflow_dispatch:

  repository_dispatch:
    types: [hourly-rss]

permissions:
  contents: write

jobs:
  update-feeds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
      
      - name: Install Python dependencies
        run: |
          uv pip install --system requests beautifulsoup4 feedgen

      - name: Generate RSS feeds
        id: generate
        shell: bash
        run: |
          set +e

          uv run --with requests --with beautifulsoup4 --with feedgen tg2rss.py $(cat channels.txt) 2>&1 | tee tg2rss.log
          status=${PIPESTATUS[0]}

          success_count=$(grep -c ': wrote ' tg2rss.log || true)

          mkdir -p docs

          for file in ./*.xml; do
            [ -f "$file" ] || continue
            mv "$file" docs/
          done

          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "success_count=$success_count" >> "$GITHUB_OUTPUT"
          echo "Successful channels: $success_count" >> "$GITHUB_STEP_SUMMARY"

          exit 0

      - name: Commit updated feeds
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Telegram RSS feeds"
          file_pattern: "docs/*.xml"

      - name: Fail only if all channels failed
        if: steps.generate.outputs.success_count == '0'
        run: exit 1
