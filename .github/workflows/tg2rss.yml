
name: tg2rss

on:
  schedule:
    - cron: "17 * * * *"
      timezone: "America/Los_Angeles"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feeds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Generate RSS feeds
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -s channels.txt ]]; then
            echo "::error::channels.txt is missing or empty"
            exit 1
          fi

          uv run tg2rss.py $(cat channels.txt)

          mkdir -p docs

          shopt -s nullglob
          xml_files=(./*.xml)

          if (( ${#xml_files[@]} == 0 )); then
            echo "::error::No XML files generated"
            exit 1
          fi

          mv -- "${xml_files[@]}" docs/

      - name: Commit updated feeds
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Telegram RSS feeds"
          file_pattern: "docs/*.xml"
